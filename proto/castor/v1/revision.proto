syntax = "proto3";

package castor.v1;

import "buf/validate/validate.proto";

// Revision is a cast's latest change of plan, and why.
message Revision {
  RecoveryAction action = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  string why = 2 [(buf.validate.field).string.min_len = 1];
}

enum RecoveryAction {
  RECOVERY_ACTION_UNSPECIFIED = 0;
  RECOVERY_ACTION_SWITCH_CANDIDATE = 1;
  RECOVERY_ACTION_DECODE_AXIS = 2;
  RECOVERY_ACTION_RELAX_READ = 3;
  RECOVERY_ACTION_SERVE_INSTEAD = 4;
  RECOVERY_ACTION_STAY = 5;
  // Android extension: convert a live source only after native planning refuses it.
  RECOVERY_ACTION_OPTIMIZE_LIVE = 1000;
  // Android extension: encode the picture in software after a hardware encoder failed.
  // Upstream proposal: stupside/castor#85.
  RECOVERY_ACTION_SOFTWARE_ENCODE = 1001;
}
